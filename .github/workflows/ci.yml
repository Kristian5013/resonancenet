name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.mode }} (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            mode: release
            cc: gcc-14
            cxx: g++-14
          - compiler: gcc
            mode: sanitize
            cc: gcc-14
            cxx: g++-14
          - compiler: clang
            mode: release
            cc: clang-19
            cxx: clang++-19
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ${{ matrix.compiler == 'gcc' && 'g++-14' || 'clang-19' }}

      - name: Build and test
        run: ci/run_tests.sh ${{ matrix.mode }}

  worker:
    name: worker (python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy tokenizers
      - name: Cross-language consensus check
        # The worker must derive the same genesis hash and the same training
        # windows as the C++ implementation; a divergence would split the network.
        run: |
          cmake -B build -S .
          cmake --build build -j"$(nproc)" --target rnet-tool
          python worker/tests/test_cross_language.py
